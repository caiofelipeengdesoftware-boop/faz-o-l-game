# Hospeda o jogo inteiro (site + servidor online) em um único endereço gratuito no Render.
services:
  - type: web
    name: faz-o-l
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
